<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Tính Giảm Chảy Cho Khách Hàng - Mobile 2 Cột</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f6f8;
            color: #222222;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-left: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header xanh lá đậm */
        .card-header {
            background-color: #26713c;
            color: #ffffff;
            padding: 14px 10px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.3px;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .card-body {
            padding: 10px 10px 40px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Khung tiêu đề phân đoạn I và II */
        .section-box {
            background-color: #ebf3eb;
            border-radius: 4px;
            padding: 8px 10px;
        }

        .section-title {
            color: #26713c;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        /* Bố trí Thông số đầu vào thành Grid 2 Cột */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Dòng full chiều rộng trong grid */
        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 12.5px;
            font-weight: 700;
            color: #333333;
            line-height: 1.2;
        }

        .form-control {
            width: 100%;
            height: 38px;
            padding: 6px 8px;
            font-size: 15px; /* Giảm nhẹ font để hợp giao diện 2 cột trên màn hình nhỏ */
            font-weight: 700;
            color: #111111;
            background-color: #fafafa;
            border: 1px solid #cccccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-control:focus {
            border-color: #26713c;
            background-color: #ffffff;
        }

        select.form-control {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            padding-right: 26px;
        }

        /* Nút bấm 3D nổi bật với hiệu ứng hover / active */
        .btn-calc {
            width: 100%;
            height: 46px;
            background: linear-gradient(135deg, #2b74bb 0%, #1f5992 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin: 6px 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #153c65, 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.15s ease-in-out;
            position: relative;
            top: 0;
        }

        /* Hiệu ứng đưa tay / rê chuột vào nút (Hover) */
        .btn-calc:hover {
            background: linear-gradient(135deg, #3884d0 0%, #256bb3 100%);
            box-shadow: 0 6px 0 #153c65, 0 8px 15px rgba(43, 116, 187, 0.4);
            top: -2px;
        }

        /* Hiệu ứng nhấn xuống 3D (Active / Click) */
        .btn-calc:active {
            top: 2px;
            box-shadow: 0 2px 0 #153c65, 0 3px 6px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #1f5992 0%, #153c65 100%);
        }

        /* Danh sách kết quả */
        .result-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .result-row-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 13.5px;
        }

        .result-row-sub .val {
            font-weight: 700;
            color: #26713c;
            font-size: 14.5px;
        }

        /* Khung nổi bật sản lượng nước thanh toán */
        .result-container {
            background-color: #ebf3eb;
            border: 1px solid #cce2cc;
            border-left: 4px solid #26713c;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .result-label {
            font-size: 13.5px;
            font-weight: 700;
            color: #111111;
        }

        .result-value {
            font-size: 16px;
            font-weight: 800;
            color: #26713c;
        }

        /* Khung nổi bật Số tiền phải thanh toán - TÔ ĐỎ NỔI BẬT (Đã tối ưu không xuống dòng) */
        .result-main {
            background-color: #fdf2f2;
            border: 1px solid #f8d7da;
            border-left: 5px solid #d9534f;
            border-radius: 6px;
            padding: 10px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            gap: 6px;
        }

        .result-main .result-label-red {
            font-size: 13px;
            color: #b02a37;
            font-weight: 800;
            line-height: 1.2;
        }

        .result-main .result-value-red {
            font-size: 15.5px;
            font-weight: 800;
            color: #d9534f;
            white-space: nowrap;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h1>BẢNG TÍNH GIẢM CHẢY CHO KHÁCH HÀNG</h1>
    </div>

    <div class="card-body">
        <!-- I. THÔNG SỐ ĐẦU VÀO -->
        <div class="section-box">
            <div class="section-title">I. THÔNG SỐ ĐẦU VÀO</div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="luongNuocChay">Lượng nước chảy (m³):</label>
                <input type="number" id="luongNuocChay" class="form-control auto-select" value="135" inputmode="decimal" step="any">
            </div>

            <div class="form-group">
                <label for="mucGiamChay">Mức giảm chảy (%):</label>
                <input type="number" id="mucGiamChay" class="form-control auto-select" value="10" inputmode="decimal" step="any">
            </div>

            <div class="form-group full-width">
                <label for="soTienThanhToan">Số tiền thanh toán (đồng):</label>
                <input type="text" id="soTienThanhToan" class="form-control auto-select" value="1.129.822" inputmode="numeric">
            </div>

            <div class="form-group full-width">
                <label for="chuKy">Chu kỳ tiêu thụ lịch sử:</label>
                <select id="chuKy" class="form-control" >
                    <option value="6 tháng" selected>6 tháng</option>
                    <option value="7 tháng">7 tháng</option>
                    <option value="5 tháng">5 tháng</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ky1">Sản lượng 1 kỳ (m³):</label>
                <input type="number" id="ky1" class="form-control auto-select" value="2" inputmode="decimal" step="any">
            </div>

            <div class="form-group">
                <label for="ky2">Sản lượng 2 kỳ (m³):</label>
                <input type="number" id="ky2" class="form-control auto-select" value="4" inputmode="decimal" step="any">
            </div>

            <div class="form-group full-width">
                <label for="ky3">Sản lượng 3 kỳ (m³):</label>
                <input type="number" id="ky3" class="form-control auto-select" value="3" inputmode="decimal" step="any">
            </div>
        </div>

        <!-- BUTTON TÍNH TOÁN -->
        <button type="button" class="btn-calc" onclick="calculateChiaSe()">Tính Toán Chia Sẻ Giảm Chảy</button>

        <!-- II. KẾT QUẢ TÍNH TOÁN -->
        <div class="section-box">
            <div class="section-title">II. KẾT QUẢ TÍNH TOÁN</div>
        </div>

        <div class="result-group">
            <div class="result-row-sub">
                <span>Mức bình quân tiêu thụ:</span>
                <span class="val" id="resMucBinhQuan">3,00 m³</span>
            </div>
            <div class="result-row-sub">
                <span>Tỷ lệ % tăng bất thường:</span>
                <span class="val" id="resTyLeTang">3.966,67 %</span>
            </div>
            <div class="result-row-sub">
                <span>Sản lượng nước chia sẻ:</span>
                <span class="val" id="resSanLuongChiaSe">11,9 m³</span>
            </div>
            <div class="result-row-sub">
                <span>Đơn giá nước bình quân:</span>
                <span class="val" id="resDonGia">8.369,05 đồng/m³</span>
            </div>

            <div class="result-container">
                <span class="result-label">Sản lượng nước thanh toán:</span>
                <span class="result-value" id="resSanLuongThanhToan">123,1 m³</span>
            </div>

            <!-- NỔI BẬT TÔ ĐỎ SỐ TIỀN KHÁCH HÀNG PHẢI THANH TOÁN -->
            <div class="result-main">
                <span class="result-label-red">Số tiền KH phải thanh toán:</span>
                <span class="result-value-red" id="resSoTienThanhToan">1.030.230 đồng</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const autoInputs = document.querySelectorAll('.auto-select');
        autoInputs.forEach(input => {
            input.addEventListener('focus', function() {
                setTimeout(() => {
                    this.select();
                }, 50);
            });
            input.addEventListener('mouseup', function(e) {
                e.preventDefault();
            });
        });
    });

    function formatNumberVi(num, decimals = 2) {
        if (isNaN(num) || !isFinite(num)) return "0";
        let parts = num.toFixed(decimals).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        
        let formatted = parts.join(',');
        if (decimals > 0) {
            formatted = formatted.replace(/,0+$/, '').replace(/(,\d*?[1-9])0+$/, '$1');
        }
        return formatted;
    }

    function parseMoneyInput(valStr) {
        if (!valStr) return 0;
        const cleanStr = valStr.toString().replace(/[^0-9]/g, '');
        return parseFloat(cleanStr) || 0;
    }

    function partsFormatted(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    const moneyInput = document.getElementById('soTienThanhToan');
    moneyInput.addEventListener('input', function() {
        let value = parseMoneyInput(this.value);
        if (value === 0 && this.value === '') {
            this.value = '';
        } else {
            this.value = partsFormatted(value);
        }
    });

    function calculateChiaSe() {
        const D4 = parseFloat(document.getElementById('luongNuocChay').value) || 0;
        const D5 = (parseFloat(document.getElementById('mucGiamChay').value) || 0) / 100;
        const D6 = parseMoneyInput(document.getElementById('soTienThanhToan').value);
        const E7 = document.getElementById('chuKy').value;

        const D8 = parseFloat(document.getElementById('ky1').value) || 0;
        const D9 = parseFloat(document.getElementById('ky2').value) || 0;
        const D10 = parseFloat(document.getElementById('ky3').value) || 0;

        const sumKy = D8 + D9 + D10;

        // D13: Mức bình quân tiêu thụ (m3)
        let D13 = 0;
        if (E7 === "6 tháng") {
            D13 = sumKy / 3;
        } else if (E7 === "7 tháng") {
            D13 = (sumKy / 7) * 2;
        } else if (E7 === "5 tháng") {
            D13 = (sumKy / 5) * 2;
        }

        // D14: Tỷ lệ % tăng bất thường (%)
        let D14 = 0;
        if (D13 >= 16) {
            D14 = D13 !== 0 ? ((D4 - D13) / D13) : 0;
        } else {
            D14 = (D4 - 16) / 3;
        }

        // D15: Sản lượng nước chia sẻ (m3)
        let D15 = 0;
        if (D13 >= 16) {
            D15 = (D4 - D13) * D5;
        } else {
            D15 = (D4 - 16) * D5;
        }

        // D16: Đơn giá (đồng)
        let D16 = D4 !== 0 ? D6 / D4 : 0;

        // D18: Sản lượng nước thanh toán (m3)
        let D18 = D4 - D15;

        // D19: Số tiền phải thanh toán (đồng)
        let D19 = D18 * D16;

        // Cập nhật giao diện
        document.getElementById('resMucBinhQuan').innerText = formatNumberVi(D13, 2) + " m³";
        document.getElementById('resTyLeTang').innerText = formatNumberVi(D14, 2) + " %";
        document.getElementById('resSanLuongChiaSe').innerText = formatNumberVi(D15, 2) + " m³";
        document.getElementById('resDonGia').innerText = formatNumberVi(D16, 2) + " đồng/m³";
        document.getElementById('resSanLuongThanhToan').innerText = formatNumberVi(D18, 2) + " m³";
        document.getElementById('resSoTienThanhToan').innerText = partsFormatted(Math.round(D19)) + " đồng";
    }

    window.onload = calculateChiaSe;
</script>

</body>
</html>
